<!--
  回测交易流水片段：分页由 /fragments/backtest/{id}/trades 返回本片段，
  outerHTML 替换 #bt-trades；未成交订单（EXPIRED）如实展示原因。
-->
<div id="bt-trades" th:fragment="trades" xmlns:th="http://www.thymeleaf.org"
     th:with="pages=${result.tradeTotal == 0 ? 1 : (result.tradeTotal + result.size - 1) / result.size}">

    <div th:replace="~{fragments/backtest-trade-tabs :: tabs('orders', ${result.task.id})}"></div>

    <div class="pager" style="padding-top:0;padding-bottom:10px">
        <span th:text="|共 ${result.tradeTotal} 笔订单|">--</span>
        <div class="pager-btns">
            <button class="btn btn-sm" th:disabled="${result.page <= 1}"
                    th:attr="hx-get=@{/fragments/backtest/{id}/trades(id=${result.task.id},page=${result.page - 1})}"
                    hx-target="#bt-trades" hx-swap="outerHTML">上一页</button>
            <span class="card-sub" th:text="|第 ${result.page} / ${pages} 页|">--</span>
            <button class="btn btn-sm" th:disabled="${result.page >= pages}"
                    th:attr="hx-get=@{/fragments/backtest/{id}/trades(id=${result.task.id},page=${result.page + 1})}"
                    hx-target="#bt-trades" hx-swap="outerHTML">下一页</button>
        </div>
    </div>

    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>信号日</th>
                <th>成交日</th>
                <th>代码</th>
                <th>名称</th>
                <th>方向</th>
                <th>状态</th>
                <th class="num">价格</th>
                <th class="num">股数</th>
                <th class="num">金额</th>
                <th class="num">费用</th>
                <th class="num">盈亏</th>
                <th>说明</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(result.trades)}">
                <td colspan="13" class="empty">区间内没有订单</td>
            </tr>
            <tr th:each="t : ${result.trades}">
                <td class="num" th:text="${t.orderNo}">1</td>
                <td th:text="${t.signalDate}">--</td>
                <td th:text="${t.filledDate != null} ? ${t.filledDate} : '未成交'">--</td>
                <td class="code" th:text="${t.code}">000001</td>
                <td>
                    <a class="name" th:href="@{/market/stock/{id}(id=${t.instrumentId})}"
                       th:text="${t.name}">标的</a>
                </td>
                <td>
                    <span th:if="${t.side == 'BUY'}" class="up">买入</span>
                    <span th:if="${t.side == 'SELL'}" class="down">卖出</span>
                </td>
                <td>
                    <span th:if="${t.status == 'FILLED'}" class="flat">成交</span>
                    <span th:if="${t.status == 'EXPIRED'}" class="txt-warn">未成交</span>
                </td>
                <td class="num"
                    th:text="${t.price != null} ? ${#numbers.formatDecimal(t.price, 1, 3)} : '--'">--</td>
                <td class="num" th:text="${t.shares != null} ? ${t.shares} : '--'">--</td>
                <td class="num"
                    th:text="${t.amount != null} ? ${#numbers.formatDecimal(t.amount, 1, 2)} : '--'">--</td>
                <td class="num"
                    th:text="${t.fee != null} ? ${#numbers.formatDecimal(t.fee, 1, 2)} : '--'">--</td>
                <td class="num"
                    th:classappend="${t.pnl != null} ? (${t.pnl >= 0} ? 'up' : 'down') : ''"
                    th:text="${t.pnl != null} ? ${#numbers.formatDecimal(t.pnl, 1, 2)} : '--'">--</td>
                <td class="card-sub" th:text="${t.reason} ?: '—'">—</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
