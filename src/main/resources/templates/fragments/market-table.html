<!--
  全市场标的表格片段（HTMX 局部刷新目标，outerHTML 替换）。
  本文件是纯片段模板：没有 html/body 外壳，直接渲染根 div。
  排序字段来自 MarketSortField 白名单；筛选参数由 #market-filters 表单收集。
-->
<div id="market-table" th:fragment="table" xmlns:th="http://www.thymeleaf.org"
     aria-live="polite">
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th th:each="col : ${sortFields}"
                    th:classappend="${(col.numeric() ? 'num ' : '') + (result.isSortedBy(col) ? 'sorted' : '')}">
                    <button type="button" class="table-sort"
                       th:hx-get="@{/fragments/market/table(sort=${col.key()},dir=${result.nextDirection(col)})}"
                       hx-include="#market-filters"
                       hx-target="#market-table"
                       hx-swap="outerHTML"
                       hx-indicator="#market-loading">
                        <span th:text="${col.label()}">列</span>
                        <span class="arrow"
                              th:text="${result.isSortedBy(col) ? (result.query.desc() ? '▼' : '▲') : '△▽'}">△▽</span>
                    </button>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(result.rows)}">
                <td colspan="8" class="empty"
                    th:text="${result.filtered()} ? '没有符合条件的标的，试试放宽筛选' : '尚无标的或快照数据，请先执行标的字典同步与快照同步'">
                </td>
            </tr>
            <tr th:each="row : ${result.rows}">
                <td class="code" th:text="${row.code}">600000</td>
                <td>
                    <a class="name" th:href="@{/market/stock/{id}(id=${row.instrumentId})}"
                       th:text="${row.name}">浦发银行</a>
                </td>
                <td class="num"
                    th:text="${row.lastPrice != null} ? ${#numbers.formatDecimal(row.lastPrice, 1, 2)} : '--'">--</td>
                <td class="num"
                    th:classappend="${row.pctChg != null} ? (${row.pctChg > 0} ? 'up' : (${row.pctChg < 0} ? 'down' : 'flat')) : ''"
                    th:text="${row.pctChg != null} ? ${#numbers.formatDecimal(row.pctChg * 100, 1, 2) + '%'} : '--'">--</td>
                <td class="num"
                    th:text="${row.amount != null} ? ${#numbers.formatDecimal(row.amount / 100000000.0, 1, 2) + ' 亿'} : '--'">--</td>
                <td class="num"
                    th:text="${row.turnoverRate != null} ? ${#numbers.formatDecimal(row.turnoverRate * 100, 1, 2) + '%'} : '--'">--</td>
                <td class="num"
                    th:text="${row.peTtm != null} ? ${#numbers.formatDecimal(row.peTtm, 1, 2)} : '--'">--</td>
                <td class="num"
                    th:text="${row.totalMv != null} ? ${#numbers.formatDecimal(row.totalMv / 100000000.0, 1, 2) + ' 亿'} : '--'">--</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pager" th:if="${result.total > 0}">
        <span th:text="|共 ${#numbers.formatInteger(result.total, 1, 'COMMA')} 条 · 第 ${result.query.page()} / ${result.totalPages()} 页|">
            --</span>
        <div class="pager-btns">
            <button class="btn" th:disabled="${!result.hasPrev()}"
                    th:hx-get="@{/fragments/market/table(page=${result.query.page() - 1},sort=${result.query.sort().key()},dir=${result.query.desc()} ? 'desc' : 'asc')}"
                    hx-include="#market-filters"
                    hx-target="#market-table" hx-swap="outerHTML" hx-indicator="#market-loading">上一页</button>
            <button class="btn" th:each="p : ${result.pageWindow()}"
                    th:classappend="${p == result.query.page()} ? 'btn-primary'"
                    th:hx-get="@{/fragments/market/table(page=${p},sort=${result.query.sort().key()},dir=${result.query.desc()} ? 'desc' : 'asc')}"
                    hx-include="#market-filters"
                    hx-target="#market-table" hx-swap="outerHTML" hx-indicator="#market-loading"
                    th:text="${p}">1</button>
            <button class="btn" th:disabled="${!result.hasNext()}"
                    th:hx-get="@{/fragments/market/table(page=${result.query.page() + 1},sort=${result.query.sort().key()},dir=${result.query.desc()} ? 'desc' : 'asc')}"
                    hx-include="#market-filters"
                    hx-target="#market-table" hx-swap="outerHTML" hx-indicator="#market-loading">下一页</button>
        </div>
    </div>
</div>
