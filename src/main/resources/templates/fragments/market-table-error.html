<!--
  HTMX 错误片段：替换请求目标本身，展示错误摘要与重试按钮。
  由 WebExceptionHandler 在 HTMX 请求失败时返回。
-->
<div id="market-table" class="fragment-error" th:fragment="error" xmlns:th="http://www.thymeleaf.org">
    <div class="notice">
        <span th:text="${message} ?: '数据加载失败，请稍后重试'">数据加载失败</span>
        <button class="btn btn-sm" th:if="${retryUrl != null}"
                th:attr="hx-get=${retryUrl}"
                hx-target="#market-table"
                hx-swap="outerHTML"
                hx-indicator="#market-loading">重试</button>
    </div>
</div>
