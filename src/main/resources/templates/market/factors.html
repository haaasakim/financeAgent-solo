<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/skeleton :: head('技术因子')}"></head>
<body>

<header th:replace="~{layout/skeleton :: nav('market')}"></header>

<main class="wrap">

    <div class="card">
        <div class="card-hd">
            <div class="card-title">
                <a class="back" th:if="${view.instrument != null}"
                   th:href="@{/market/stock/{id}(id=${instrumentId})}" data-history-back
                   title="返回刚才的来源页面；直接打开时返回个股详情">← 返回上一页</a>
                <a class="back" th:unless="${view.instrument != null}"
                   href="/market" data-history-back title="返回刚才的来源页面；直接打开时返回市场">← 返回上一页</a>
                技术因子
                <span class="code" th:text="${instrumentId}">000001.SZ</span>
            </div>
            <div class="card-sub" th:if="${view.instrument != null}"
                 th:text="${view.instrument.name}">平安银行</div>
            <div class="card-sub" th:if="${view.instrument == null}">标的字典中不存在该 ID</div>
        </div>

        <form class="toolbar" method="get" th:action="@{/market/factors}">
            <input type="text" name="instrumentId" th:value="${instrumentId}"
                   placeholder="如 000001.SZ">
            <select name="limit">
                <option th:each="n : ${limitOptions}" th:value="${n}"
                        th:selected="${n == limit}" th:text="|最近 ${n} 个交易日|">最近 60 个交易日</option>
            </select>
            <button class="btn" type="submit">查询</button>
            <span class="card-sub">价格与 MACD 单位：元；收益 / 波动率 / 距高点为小数（页面按百分比显示）；缺失为 --</span>
        </form>

        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>日期</th>
                    <th class="num">MA5</th>
                    <th class="num">MA10</th>
                    <th class="num">MA20</th>
                    <th class="num">MA60</th>
                    <th class="num">DIF</th>
                    <th class="num">DEA</th>
                    <th class="num">HIST</th>
                    <th class="num">RSI6</th>
                    <th class="num">RSI12</th>
                    <th class="num">RSI24</th>
                    <th class="num">20日收益</th>
                    <th class="num">60日收益</th>
                    <th class="num">波动率20</th>
                    <th class="num">距52周高点</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(view.rows)}">
                    <td colspan="15" class="empty">
                        该标的暂无因子数据（可能未同步日K，或未执行 --factor.init）
                    </td>
                </tr>
                <tr th:each="r : ${view.rows}">
                    <td th:text="${r.tradeDate}">2026-09-11</td>
                    <td class="num" th:text="${r.ma5 != null} ? ${#numbers.formatDecimal(r.ma5, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.ma10 != null} ? ${#numbers.formatDecimal(r.ma10, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.ma20 != null} ? ${#numbers.formatDecimal(r.ma20, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.ma60 != null} ? ${#numbers.formatDecimal(r.ma60, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.macdDif != null} ? ${#numbers.formatDecimal(r.macdDif, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.macdDea != null} ? ${#numbers.formatDecimal(r.macdDea, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.macdHist != null} ? ${#numbers.formatDecimal(r.macdHist, 1, 3)} : '--'">--</td>
                    <td class="num" th:text="${r.rsi6 != null} ? ${#numbers.formatDecimal(r.rsi6, 1, 2)} : '--'">--</td>
                    <td class="num" th:text="${r.rsi12 != null} ? ${#numbers.formatDecimal(r.rsi12, 1, 2)} : '--'">--</td>
                    <td class="num" th:text="${r.rsi24 != null} ? ${#numbers.formatDecimal(r.rsi24, 1, 2)} : '--'">--</td>
                    <td class="num"
                        th:classappend="${r.return20 != null} ? (${r.return20 > 0} ? 'up' : (${r.return20 < 0} ? 'down' : 'flat')) : ''"
                        th:text="${r.return20 != null} ? ${#numbers.formatDecimal(r.return20 * 100, 1, 2) + '%'} : '--'">--</td>
                    <td class="num"
                        th:classappend="${r.return60 != null} ? (${r.return60 > 0} ? 'up' : (${r.return60 < 0} ? 'down' : 'flat')) : ''"
                        th:text="${r.return60 != null} ? ${#numbers.formatDecimal(r.return60 * 100, 1, 2) + '%'} : '--'">--</td>
                    <td class="num"
                        th:text="${r.volatility20 != null} ? ${#numbers.formatDecimal(r.volatility20 * 100, 1, 2) + '%'} : '--'">--</td>
                    <td class="num"
                        th:classappend="${r.pctFrom52wHigh != null} ? (${r.pctFrom52wHigh < 0} ? 'down' : 'flat') : ''"
                        th:text="${r.pctFrom52wHigh != null} ? ${#numbers.formatDecimal(r.pctFrom52wHigh * 100, 1, 2) + '%'} : '--'">--</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{layout/skeleton :: scripts}"></div>
</body>
</html>
