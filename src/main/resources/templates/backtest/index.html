<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/skeleton :: head('回测')}"></head>
<body>

<header th:replace="~{layout/skeleton :: nav('backtest')}"></header>

<main class="wrap">

    <div class="card" style="margin-bottom:16px">
        <div class="card-hd">
            <div>
                <div class="card-title">回测参数</div>
                <div class="card-sub" th:if="${defaultEnd != null}"
                     th:text="|数据截至 ${defaultEnd} · 信号 T 日收盘，成交 T+1 开盘|">--</div>
            </div>
            <a class="btn btn-sm" href="/screener" data-history-back>返回上一页</a>
        </div>

        <form id="bt-form" hx-post="/fragments/backtest/run"
              hx-target="#bt-run-area" hx-swap="innerHTML"
              hx-indicator="#bt-loading">
            <div class="form-grid">
                <div class="field">
                    <label>策略</label>
                    <select name="strategyId" required>
                        <option value="">选择策略</option>
                        <option th:each="s : ${strategies}" th:value="${s.id}" th:text="${s.name}"
                                th:selected="${selectedStrategyId != null and selectedStrategyId == s.id}"></option>
                    </select>
                </div>
                <div class="field">
                    <label>开始日期</label>
                    <input type="date" name="startDate" required th:value="${defaultStart}">
                </div>
                <div class="field">
                    <label>结束日期</label>
                    <input type="date" name="endDate" required th:value="${defaultEnd}">
                </div>
                <div class="field">
                    <label>调仓频率</label>
                    <select name="frequency">
                        <option value="DAILY" th:selected="${selectedFrequency == 'DAILY'}">每日</option>
                        <option value="WEEKLY" th:selected="${selectedFrequency == 'WEEKLY'}">每周</option>
                        <option value="MONTHLY" th:selected="${selectedFrequency == 'MONTHLY'}">每月</option>
                        <option value="QUARTERLY" th:selected="${selectedFrequency == 'QUARTERLY'}">每季</option>
                    </select>
                </div>
                <div class="field">
                    <label>持仓数量（1 ~ 100，等权）</label>
                    <input type="number" name="topN" th:value="${selectedTopN}"
                           min="1" max="100" step="1" list="topn-presets">
                    <datalist id="topn-presets">
                        <option value="10"></option>
                        <option value="20"></option>
                        <option value="30"></option>
                        <option value="50"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label>初始资金（元）</label>
                    <input type="number" name="initialCapital" th:value="${defaultInitialCapital}"
                           min="1000" step="1000">
                </div>
                <div class="field">
                    <label>佣金率（%）</label>
                    <input type="number" name="commissionRatePct" th:value="${defaultCommissionRatePct}"
                           min="0" max="1" step="0.001">
                </div>
                <div class="field">
                    <label>印花税（%，卖出）</label>
                    <input type="number" name="stampTaxPct" th:value="${defaultStampTaxPct}"
                           min="0" max="1" step="0.001">
                </div>
                <div class="field">
                    <label>滑点（bps）</label>
                    <input type="number" name="slippageBps" th:value="${defaultSlippageBps}"
                           min="0" max="100" step="1">
                </div>
                <div class="field">
                    <label>止损（%，0 关闭）</label>
                    <input type="number" name="stopLossPct" th:value="${defaultStopLossPct}"
                           min="0" max="50" step="1">
                </div>
                <div class="field">
                    <label>时间止损（交易日，0 关闭）</label>
                    <input type="number" name="timeStopDays" th:value="${defaultTimeStopDays}"
                           min="0" max="250" step="1">
                </div>
                <div class="field">
                    <label>基准</label>
                    <select name="benchmarkId">
                        <option th:each="b : ${benchmarks}" th:value="${b.instrumentId}"
                                th:text="${b.name}"
                                th:selected="${selectedBenchmarkId == b.instrumentId}"></option>
                    </select>
                </div>
            </div>

            <div class="toolbar" style="margin-top:16px">
                <button class="btn btn-primary" type="submit"
                        th:disabled="${#lists.isEmpty(strategies) or #lists.isEmpty(benchmarks)}">
                    开始回测
                </button>
                <span id="bt-loading" class="card-sub htmx-indicator">提交中…</span>
                <span class="card-sub" th:if="${#lists.isEmpty(strategies)}">
                    还没有已保存策略，先到「选股」页保存一个
                </span>
                <span class="card-sub" th:unless="${#lists.isEmpty(benchmarks)}">
                    回测按历史时点截面取数；估值（PE/PB）可用，财务与股息因子暂无数据
                </span>
            </div>
        </form>
    </div>

    <div id="bt-run-area">
        <div th:if="${loadError != null}" class="notice" th:text="${loadError}">--</div>
        <div th:if="${result != null}">
            <div th:replace="~{fragments/backtest-result :: result}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/backtest-recent-tasks :: recent}"></div>

</main>

<script th:src="@{/js/echarts.min.js?v=5.5.0}"></script>
<div th:replace="~{layout/skeleton :: scripts}"></div>
</body>
</html>
