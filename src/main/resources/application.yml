spring:
  application:
    name: financeAgent

  datasource:
    url: jdbc:sqlite:./data/finance.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: finance-pool
      maximum-pool-size: 5
      # sqlite-jdbc 的部分版本 isValid() 实现不完整，显式给出探测语句更稳
      connection-test-query: SELECT 1
      connection-init-sql: "PRAGMA busy_timeout=5000"

  thymeleaf:
    # 开发期关闭模板缓存，改模板后刷新即生效；模板目录已存在
    cache: false

  web:
    resources:
      cache:
        period: 0

server:
  port: 8080

finance:
  migration:
    locations: classpath:db/migration

  providers:
    http:
      connect-timeout-seconds: 10
      read-timeout-seconds: 15
      max-retry: 3
      # 实测腾讯 3.3 QPS 连发 30 次零失败，默认留出余量取 5 QPS
      rate-limit-qps: 5
      # 连续失败达到阈值暂停冷却：实测腾讯持续批量抓取时返回 HTTP 501，冷却后恢复
      circuit-breaker-threshold: 5
      cooldown-seconds: 60
    quote:
      # 行情源顺序：primary 指定的源优先，另一个自动作为备源
      primary: eastmoney
      eastmoney-host: https://push2his.eastmoney.com
      # 日K域名按序回退。实测 ifzq.gtimg.cn 前置腾讯 WAF，
      # 对 Java/Python 客户端持续返回 501（curl 正常），故 web 域优先
      tencent-kline-hosts:
        - https://web.ifzq.gtimg.cn
        - https://ifzq.gtimg.cn
    snapshot:
      order: [sina]

  sync:
    history-years: 10
    # 腾讯单次上限 800 条（约 3.2 年），按 3 年一段切分以保证不触发降级
    segment-years: 3
    batch-size: 500
    # 快照同步的条数下限：全市场股票 + ETF 正常约 7,200，低于该值视为接口静默降级
    snapshot-min-total: 5000
    # 覆盖审计：首根日K晚于应有起点超过该天数 → 历史缺口；末根早于最新交易日超过该天数 → 近期无成交（不回填）
    coverage-start-grace-days: 15
    coverage-stale-days: 30
    # 收盘后自动同步：交易日 16:10 执行；应用收盘后启动且当天未同步时会异步补一次
    schedule:
      enabled: true
      cron: "0 10 16 * * MON-FRI"
      zone: Asia/Shanghai
      catch-up: true
      # macOS 睡眠会漏掉 cron，看门狗每 60s 用墙钟检查并在唤醒后补跑
      watchdog-enabled: true
      watchdog-ms: 60000
      watchdog-retry-minutes: 15

  market:
    # 市场概览条的指数清单，由 --sync.indexes 入库
    indexes:
      - id: "000001.SH"
        name: "上证指数"
      - id: "399001.SZ"
        name: "深证成指"
      - id: "399006.SZ"
        name: "创业板指"
      - id: "000300.SH"
        name: "沪深300"

# 持久层使用 MyBatis：接口在 data/mapper，SQL 在 resources/mapper/*.xml。
mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 全局注册自定义 TypeHandler（SQLite 的日期以 ISO 文本存取）
  type-handlers-package: org.haaasaki.financeagent.data.mybatis
  configuration:
    # 表列名为下划线风格，映射到 record 组件的驼峰命名
    map-underscore-to-camel-case: true

# 日志的 appender、滚动策略与格式由 src/main/resources/logback-spring.xml 管理。
# 这里只保留级别开关——改级别比改 XML 方便。
logging:
  level:
    root: INFO
    org.haaasaki.financeagent: INFO
